<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Window Garden - Sistema Real</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600&family=Plus+Jakarta+Sans:wght@700;800&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
       tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "brand-bg": "#fadbf2",
                        "brand-primary": "#D56989",
                        "brand-accent": "#C2DC80",
                        "forest": "#2C4C3B"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-forest min-h-screen pb-12">
    
    <header class="bg-white/90 backdrop-blur-md border-b border-rose-50 sticky top-0 z-50"> 
        <div class="flex justify-between items-center px-6 py-4 max-w-[1100px] mx-auto">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-brand-accent text-2xl" style="font-variation-settings: 'FILL' 1;">Bem-Vindo(a) ao</span>
                <span class="text-2xl font-extrabold text-brand-primary tracking-tighter">Window Garden</span>
            </div>
            <div id="status-badge" class="text-[10px] bg-gray-100 text-gray-500 px-2 py-1 rounded-md font-bold uppercase">A verificar servidor...</div>
        </div>
    </header>

    <main class="max-w-[1100px] mx-auto px-6 pt-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm mb-12 border border-rose-50">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-brand-primary uppercase">Categoria</label>
                    <select id="filtro-categoria" class="rounded-xl border-gray-200">
                        <option value="Todos">Tudo</option>
                        <option value="Folhagem">Folhagem</option>
                        <option value="Flor">Flor</option>
                        <option value="Horta">Horta</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-brand-primary uppercase">Sol</label>
                    <select id="filtro-sol" class="rounded-xl border-gray-200">
                        <option value="Todos">Qualquer luz</option>
                        <option value="Luz indireta">Luz Indireta</option>
                        <option value="Sol direto">Sol Direto</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-brand-primary uppercase">Vaso Ideal</label>
                    <select id="filtro-vaso" class="rounded-xl border-gray-200">
                        <option value="Todos">Qualquer vaso</option>
                        <option value="Barro">Barro / Cerâmica</option>
                        <option value="Plástico">Plástico</option>
                        <option value="Pendurado">Pendurado</option>
                        <option value="Grande">Vasos Grande / Chão</option>
                    </select>
                </div>
            </div>
            <button onclick="buscarEFiltrar()" class="w-full bg-brand-accent hover:bg-forest hover:text-white text-forest font-bold py-4 rounded-xl transition-all">
                BUSCAR NO BANCO DE DADOS
            </button>
        </div>

        <div id="mensagem" class="text-center mb-8 font-medium"></div>
        <div id="grid-plantas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

<script>
    const API_URL = 'http://localhost:3000/plantas';

    async function buscarEFiltrar() { //Filtro pras pesquisas
        const msg = document.getElementById('mensagem');
        const badge = document.getElementById('status-badge');
        
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('Falha no servidor');
            
            const dados = await response.json();
            badge.className = "text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-md font-bold uppercase";
            badge.innerText = "ONLINE";

            const catSel = document.getElementById('filtro-categoria').value;
            const solSel = document.getElementById('filtro-sol').value;
            const vasoSel = document.getElementById('filtro-vaso').value;

            const filtradas = dados.filter(p => {
                const bateCat = catSel === "Todos" || (p.categoria || "").includes(catSel);
                const bateSol = solSel === "Todos" || (p.sol_necessario || "").includes(solSel);
                const bateVaso = vasoSel === "Todos" || (p.tipo_vaso || "").includes(vasoSel);
                return bateCat && bateSol && bateVaso;
            });

            renderizar(filtradas);
        } catch (error) {
            badge.className = "text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded-md font-bold uppercase";
            badge.innerText = "OFFLINE";
            msg.innerHTML = "<b class='text-red-500'>Ligue o Node (server.js) e o Laragon!</b>";
        }
    }

    function renderizar(lista) {
        const grid = document.getElementById('grid-plantas');
        const msg = document.getElementById('mensagem');
        
        msg.innerText = lista.length === 0 ? "Nenhuma planta encontrada." : `Encontradas ${lista.length} plantas!`;
        
        grid.innerHTML = lista.map(p => {
            const nomeBase = p.nome;
            // Iniciando a busca das imagens por jpg
            const caminhoInicial = `pic/${nomeBase}.jpg`;

            return `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-rose-50 flex flex-col h-full">
                    <div class="relative h-64 bg-gray-50 flex items-center justify-center overflow-hidden">
                        <img src="${caminhoInicial}" 
                             class="w-full h-full object-contain p-2 transition-transform duration-300 hover:scale-105"
                             onerror="verificarImagens(this, '${nomeBase}')">
                    </div>
                    <div class="p-6 flex-grow">
                        <h3 class="text-xl font-bold text-forest">${p.nome}</h3>
                        <p class="text-xs text-brand-primary italic mb-4">${p.especie || ''}</p>
                        <div class="space-y-2 border-t pt-4">
                            <div class="flex items-center gap-2 text-[10px] font-bold uppercase">
                                <span class="material-symbols-outlined text-sm text-brand-accent">Sol Necessário</span> 
                                <span class="text-gray-400">Sol:</span> ${p.sol_necessario}
                            </div>
                            <div class="flex items-center gap-2 text-[10px] font-bold uppercase">
                                <span class="material-symbols-outlined text-sm text-brand-primary">Frequência de Rega</span>
                                <span class="text-gray-400">Rega:</span> ${p.frequencia_rega}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function verificarImagens(img, nome) { //Filtragem pra ver se as imagens são png, jpg ou jpeg
        const extensoes = ['.png', '.jpeg', '.PNG', '.JPG', '.JPEG'];
        
        // Descobre qual foi a última tentativa baseada na URL atual
        let index = -1;
        if (img.src.includes('.jpg')) index = -1;
        else if (img.src.includes('.png') || img.src.includes('.PNG')) index = 0;
        else if (img.src.includes('.jpeg') || img.src.includes('.JPEG')) index = 2;

        let proximo = index + 1;

        if (proximo < extensoes.length) {
            img.src = `pic/${nome}${extensoes[proximo]}`;
        } else {
            // Se tudo falar o erro aparece
            img.onerror = null;
            img.src = `https://placehold.co/400x300/F3EEF1/D56989?text=${encodeURIComponent(nome)}`;
        }
    }

    window.onload = buscarEFiltrar;
</script>
</body>
</html>
