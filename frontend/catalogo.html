        const grid = document.getElementById('catalogo-grid');

        const renderPlantas = () => {
            const htmlCards = plantasDatabase.map(planta => `
                <div class="bg-brand-secondary/10 rounded-xl p-4 squishy-shadow hover:squishy-shadow-hover transition-shadow duration-300 flex flex-col">

                    <div class="mt-auto space-y-1">
                        <p class="font-body-sm text-xs text-forest"><strong>☀️ Luz:</strong> ${planta["Sol Necessário"]}</p>
                        <p class="font-body-sm text-xs text-forest"><strong>💧 Rega:</strong> ${planta["Frequência de Rega"]}</p>
                        <p class="font-body-sm text-xs text-forest"><strong>🪴 Vaso:</strong> ${planta["Tipo de Vaso"]}</p>
                    </div>
                </div>
            `).join('');

            grid.innerHTML = htmlCards;
        };

        document.addEventListener('DOMContentLoaded', renderPlantas);
